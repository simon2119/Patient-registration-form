<!DOCTYPE html>
<html>
<head>
    <title>Patient Registration Form</title>
</head>

<body>

    <h1>Patient Registration Form</h1>

    <form>

        <p>
            <label>Patient Name:</label>
            <input type="text" name="patient_name">
        </p>

        <p>
            <label>Age:</label>
            <input type="number" name="age">
        </p>

        <p>
            <label>Date of Birth:</label>
            <input type="date" name="date_of_birth">
        </p>

        <p>
            <label>Gender:</label>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
        </p>

        <p>
            <label>ID Number:</label>
            <input type="text" name="id_number">
        </p>

        <p>
            <label>Patient ID:</label>
            <input type="text" name="patient_id">
        </p>

        <p>
            <label>Phone Number:</label>
            <input type="tel" name="phone_number">
        </p>

        <p>
            <label>Health Status:</label>
            <input type="checkbox" name="disability" value="yes">
            Disability
        </p>

        <p>
            <label>Address:</label>
            <input type="text" name="address">
        </p>

        <p>
            <label>Marital Status:</label>
            <input type="radio" name="marital_status" value="single"> Single
            <input type="radio" name="marital_status" value="married"> Married
        </p>

        <p>
            <label>Next of Kin:</label>
            <input type="text" name="next_of_kin">
        </p>

        <p>
            <label>Weight:</label>
            <input type="number" name="weight">
        </p>

        <p>
            <input type="submit" value="Register Patient">
        </p>

    </form>

</body>
</html>
